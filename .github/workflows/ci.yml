name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Build website
        run: pnpm run build:website

      - name: Package
        run: pnpm exec vsce package --no-dependencies --out warm-up.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: warm-up.vsix
          retention-days: 7

  integration:
    name: Extension tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # VS Code needs a display server on Linux.
      - name: Run VS Code tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec vscode-test

      - name: Run VS Code tests
        if: runner.os != 'Linux'
        run: pnpm exec vscode-test
